<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs>
<rect width="1800" height="1120" fill="#ffffff"/>
<text x="40" y="50" font-size="28" font-weight="700" fill="#1f2933">Soracity システム構成図（検証用）</text>
<text x="40" y="78" font-size="14" fill="#52606d">検証用リポジトリ（sunlight-test）で今動いているもの（2026-10-16 時点）。日差しの計算と映像の見え方を確かめるための構成</text>
<text x="40" y="118" font-size="15" font-weight="700" fill="#4a86c5">開発・確かめ方</text>
<rect x="40" y="130" width="340" height="100" rx="10" fill="#e8f1fb" stroke="#4a86c5" stroke-width="2"/>
<text x="54" y="156" font-size="17" font-weight="700" fill="#1f2933">GitHub（main）</text>
<text x="54" y="179" font-size="13.5" fill="#52606d">sunlight-test：検証用（公開）</text>
<text x="54" y="199.5" font-size="13.5" fill="#52606d">設置場所の情報は入れない</text>
<rect x="40" y="290" width="340" height="150" rx="10" fill="#e8f1fb" stroke="#4a86c5" stroke-width="2"/>
<text x="54" y="316" font-size="17" font-weight="700" fill="#1f2933">開発用の Mac</text>
<text x="54" y="339" font-size="13.5" fill="#52606d">Apple M4（GPU 10 コア）</text>
<text x="54" y="359.5" font-size="13.5" fill="#52606d">重さの実測もこの PC</text>
<text x="54" y="380" font-size="13.5" fill="#52606d">npm run dev ／ npm run app</text>
<text x="54" y="400.5" font-size="13.5" fill="#52606d">.env：PC ごとの緯度経度（Git の外）</text>
<rect x="40" y="490" width="340" height="170" rx="10" fill="#e8f1fb" stroke="#4a86c5" stroke-width="2"/>
<text x="54" y="516" font-size="17" font-weight="700" fill="#1f2933">テスト（npm run check）</text>
<text x="54" y="539" font-size="13.5" fill="#52606d">型チェック（TypeScript）</text>
<text x="54" y="559.5" font-size="13.5" fill="#52606d">TypeScript のテスト（node --test）</text>
<text x="54" y="580" font-size="13.5" fill="#52606d">Python のテスト（solar.py）</text>
<text x="54" y="600.5" font-size="13.5" fill="#52606d">基準値：pvlib で作った</text>
<text x="54" y="621" font-size="13.5" fill="#52606d">tests/fixtures.json と照らし合わせる</text>
<rect x="40" y="710" width="340" height="150" rx="10" fill="#e8f1fb" stroke="#4a86c5" stroke-width="2"/>
<text x="54" y="736" font-size="17" font-weight="700" fill="#1f2933">検証場所で見比べる</text>
<text x="54" y="759" font-size="13.5" fill="#52606d">実際の日差し（窓枠の影）と、</text>
<text x="54" y="779.5" font-size="13.5" fill="#52606d">画面の矢印・平面図・グラフを比べる</text>
<text x="54" y="800" font-size="13.5" fill="#52606d">（verification.md 10.1 節）</text>
<path d="M210,290 L210,230" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="222" y="265" font-size="12.5" fill="#52606d" text-anchor="start">push・pull</text>
<path d="M210,440 L210,490" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#a)"/>
<text x="222" y="470" font-size="12.5" fill="#52606d" text-anchor="start">実行</text>
<path d="M380,365 L420,365" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#a)"/>
<path d="M420,785 L380,785" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#a)"/>
<text x="400" y="775" font-size="12.5" fill="#52606d" text-anchor="middle">画面</text>
<rect x="420" y="130" width="940" height="870" rx="14" fill="#f5f6f8" stroke="#9aa5b1" stroke-width="2"/>
<text x="434" y="156" font-size="19" font-weight="700" fill="#1f2933">アプリ（ブラウザでも Electron でも同じ画面）</text>
<rect x="450" y="180" width="430" height="100" rx="10" fill="#ffffff" stroke="#3e4c59" stroke-width="2"/>
<text x="464" y="206" font-size="17" font-weight="700" fill="#1f2933">ブラウザ：Vite 開発サーバー</text>
<text x="464" y="229" font-size="13.5" fill="#52606d">localhost:5173/?mode=…</text>
<text x="464" y="249.5" font-size="13.5" fill="#52606d">保存すると即反映。設定の保存も開発サーバー経由</text>
<rect x="900" y="180" width="430" height="100" rx="10" fill="#ffffff" stroke="#3e4c59" stroke-width="2"/>
<text x="914" y="206" font-size="17" font-weight="700" fill="#1f2933">Electron アプリ</text>
<text x="914" y="229" font-size="13.5" fill="#52606d">npm run app（:visuals・:room・:kiosk）</text>
<text x="914" y="249.5" font-size="13.5" fill="#52606d">監視・ログ・復帰。app:forever で長期稼働</text>
<path d="M665,280 L665,320" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#a)"/>
<path d="M1115,280 L1115,320" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#a)"/>
<rect x="450" y="320" width="260" height="175" rx="10" fill="#eef7ee" stroke="#4f9a5b" stroke-width="2"/>
<text x="464" y="346" font-size="17" font-weight="700" fill="#1f2933">設定（config/）</text>
<text x="464" y="369" font-size="13" fill="#52606d">site.json：検証場所・本番の候補</text>
<text x="464" y="389" font-size="13" fill="#52606d">app.json：起動のモード・窓</text>
<text x="464" y="409" font-size="13" fill="#52606d">visuals.json：映像の調整値</text>
<text x="464" y="429" font-size="13" fill="#52606d">room.json：部屋の設定</text>
<text x="464" y="449" font-size="13" fill="#52606d">.env で緯度経度を上書き</text>
<rect x="450" y="525" width="260" height="135" rx="10" fill="#eef7ee" stroke="#4f9a5b" stroke-width="2"/>
<text x="464" y="551" font-size="17" font-weight="700" fill="#1f2933">太陽の計算</text>
<text x="464" y="574" font-size="13" fill="#52606d">solar.ts（NOAA / Meeus）</text>
<text x="464" y="594" font-size="13" fill="#52606d">時計：現在・早送り・日時の指定</text>
<text x="464" y="614" font-size="13" fill="#52606d">→ 光の向き・高さ・色温度</text>
<rect x="450" y="690" width="260" height="120" rx="10" fill="#eef7ee" stroke="#4f9a5b" stroke-width="2"/>
<text x="464" y="716" font-size="17" font-weight="700" fill="#1f2933">描画</text>
<text x="464" y="739" font-size="13" fill="#52606d">WebGPU（three.js）</text>
<text x="464" y="759" font-size="13" fill="#52606d">使えなければ自動で WebGL2</text>
<text x="464" y="779" font-size="13" fill="#52606d">?gpu=webgl で切り替え</text>
<path d="M580,495 L580,525" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#a)"/>
<path d="M710,590 L740,590" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#a)"/>
<path d="M740,750 L710,750" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#a)"/>
<rect x="740" y="320" width="590" height="490" rx="10" fill="#fff6e5" stroke="#d08a1e" stroke-width="2"/>
<text x="754" y="346" font-size="16" font-weight="700" fill="#1f2933">4 つのモード（画面上部のスイッチ・Ctrl/Cmd + Shift + M）</text>
<rect x="755" y="365" width="275" height="205" rx="10" fill="#ffffff" stroke="#d08a1e" stroke-width="2"/>
<text x="769" y="391" font-size="15" font-weight="700" fill="#1f2933">検証</text>
<text x="769" y="412" font-size="13" fill="#52606d">平面図（太陽・窓・スクリーン）</text>
<text x="769" y="432" font-size="13" fill="#52606d">1 日の太陽高度グラフ</text>
<text x="769" y="452" font-size="13" fill="#52606d">計算値（方位角・高度・光の向き）</text>
<text x="769" y="472" font-size="13" fill="#52606d">「現在時刻」で実際の日差しと</text>
<text x="769" y="492" font-size="13" fill="#52606d">見比べる</text>
<rect x="1045" y="365" width="270" height="205" rx="10" fill="#ffffff" stroke="#d08a1e" stroke-width="2"/>
<text x="1059" y="391" font-size="15" font-weight="700" fill="#1f2933">visuals</text>
<text x="1059" y="412" font-size="13" fill="#52606d">映像の制作・切り替え・調整</text>
<text x="1059" y="432" font-size="13" fill="#52606d">外光のシミュレーション</text>
<text x="1059" y="452" font-size="13" fill="#52606d">ガイド（継ぎ目・重なり）</text>
<text x="1059" y="472" font-size="13" fill="#52606d">PNG の書き出し（3840×1080）</text>
<text x="1059" y="492" font-size="13" fill="#52606d">設定の保存（visuals.json）</text>
<rect x="755" y="585" width="275" height="210" rx="10" fill="#ffffff" stroke="#d08a1e" stroke-width="2"/>
<text x="769" y="611" font-size="15" font-weight="700" fill="#1f2933">room</text>
<text x="769" y="632" font-size="13" fill="#52606d">仮想の部屋に日差しを再現</text>
<text x="769" y="652" font-size="13" fill="#52606d">パストレーシング・窓の位置</text>
<text x="769" y="672" font-size="13" fill="#52606d">水面の反射・雲・光の軌跡</text>
<text x="769" y="692" font-size="13" fill="#52606d">設定の保存（room.json）</text>
<text x="769" y="712" font-size="13" fill="#52606d">ほかの画面と設定を共有</text>
<rect x="1045" y="585" width="270" height="210" rx="10" fill="#ffffff" stroke="#d08a1e" stroke-width="2"/>
<text x="1059" y="611" font-size="15" font-weight="700" fill="#1f2933">展示（kiosk）</text>
<text x="1059" y="632" font-size="13" fill="#52606d">3840×1080 の枠なしウィンドウ</text>
<text x="1059" y="652" font-size="13" fill="#52606d">visuals で保存した映像だけ</text>
<text x="1059" y="672" font-size="13" fill="#52606d">長期稼働のテストに使う</text>
<text x="1059" y="692" font-size="13" fill="#52606d">本番では room の空間を出す</text>
<text x="1059" y="712" font-size="13" fill="#52606d">予定（本番の構成図）</text>
<rect x="450" y="850" width="430" height="120" rx="10" fill="#ffffff" stroke="#3e4c59" stroke-width="2"/>
<text x="464" y="876" font-size="17" font-weight="700" fill="#1f2933">ログ（logs/）</text>
<text x="464" y="899" font-size="13" fill="#52606d">起動・復帰・異常、5 分ごとの FPS・メモリ</text>
<text x="464" y="919" font-size="13" fill="#52606d">npm run logs で集計（verification.md 10.2 節）</text>
<rect x="900" y="850" width="430" height="120" rx="10" fill="#ffffff" stroke="#3e4c59" stroke-width="2"/>
<text x="914" y="876" font-size="17" font-weight="700" fill="#1f2933">重さを測る</text>
<text x="914" y="899" font-size="13" fill="#52606d">room のパネル「重さを測る（60 フレーム）」</text>
<text x="914" y="919" font-size="13" fill="#52606d">GPU の時間を状態の表示とログに出す</text>
<path d="M665,810 L665,850" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#a)"/>
<text x="677" y="835" font-size="12.5" fill="#52606d" text-anchor="start">書く</text>
<text x="1400" y="118" font-size="15" font-weight="700" fill="#c4566b">出力・本番へ</text>
<rect x="1400" y="300" width="360" height="130" rx="10" fill="#fdecef" stroke="#c4566b" stroke-width="2"/>
<text x="1414" y="326" font-size="17" font-weight="700" fill="#1f2933">画面（開発用の Mac）</text>
<text x="1414" y="349" font-size="13.5" fill="#52606d">ブラウザの幅に縮めて表示</text>
<text x="1414" y="369.5" font-size="13.5" fill="#52606d">展示モードは 3840×1080 の</text>
<text x="1414" y="390" font-size="13.5" fill="#52606d">ウィンドウで表示</text>
<rect x="1400" y="490" width="360" height="160" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1414" y="516" font-size="17" font-weight="700" fill="#1f2933">本番用のリポジトリへ（予定）</text>
<text x="1414" y="539" font-size="13.5" fill="#52606d">確かめた太陽の計算・room の部屋・</text>
<text x="1414" y="559.5" font-size="13.5" fill="#52606d">監視の仕組みを持っていく</text>
<text x="1414" y="580" font-size="13.5" fill="#52606d">検証のモードは持っていくが</text>
<text x="1414" y="600.5" font-size="13.5" fill="#52606d">展示には出さない（本番の構成図）</text>
<path d="M1360,365 L1400,365" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#a)"/>
<path d="M1360,570 L1400,570" fill="none" stroke="#7b8794" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/>
<rect x="40" y="1044" width="34" height="20" rx="4" fill="#fff" stroke="#3e4c59" stroke-width="2"/>
<text x="84" y="1060" font-size="13.5" fill="#52606d">実装済み（検証用リポジトリ）</text>
<rect x="300" y="1044" width="34" height="20" rx="4" fill="#fff" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 4"/>
<text x="344" y="1060" font-size="13.5" fill="#52606d">予定</text>
<text x="40" y="1092" font-size="13" fill="#52606d">設置場所の情報（位置・寸法）はこの図に含めていない。詳しくは README・docs/verification.md・docs/room.md。</text>
