<text x="54" y="156" font-size="17" font-weight="700" fill="#1f2933">開発 PC（検証用）</text>
<text x="54" y="179" font-size="13.5" fill="#52606d">検証用のモードで確かめる（本番には出さない）</text>
<text x="54" y="199.5" font-size="13.5" fill="#52606d">検証・visuals・room（パネルで調整）</text>
<text x="54" y="220" font-size="13.5" fill="#52606d">テスト：TypeScript ＋ Python（pvlib）</text>
<text x="54" y="240.5" font-size="13.5" fill="#52606d">ビルド：dist/ ＋ dist-electron/</text>
<rect x="40" y="360" width="340" height="110" rx="10" fill="#e8f1fb" stroke="#4a86c5" stroke-width="2"/>
<text x="54" y="386" font-size="17" font-weight="700" fill="#1f2933">GitHub（main）</text>
<text x="54" y="409" font-size="13.5" fill="#52606d">本番用の非公開リポジトリ（予定）</text>
<text x="54" y="429.5" font-size="13.5" fill="#52606d">検証用の sunlight-test を元に作る</text>
<rect x="40" y="530" width="340" height="140" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="8 6"/>
<text x="54" y="556" font-size="17" font-weight="700" fill="#1f2933">更新の実行役（設計）</text>
<text x="54" y="579" font-size="13.5" fill="#52606d">セルフホストランナー</text>
<text x="54" y="599.5" font-size="13.5" fill="#52606d">（予備：定期的に git fetch）</text>
<text x="54" y="620" font-size="13.5" fill="#52606d">取り出し → テスト → 切り替え</text>
<text x="54" y="640.5" font-size="13.5" fill="#52606d">失敗したら前の版に戻す</text>
