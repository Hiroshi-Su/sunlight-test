<text x="40" y="50" font-size="28" font-weight="700" fill="#1f2933">Soracity システム構成図（本番）</text>
<text x="40" y="78" font-size="14" fill="#52606d">展示で動かす構成（2026-10-16 時点の予定）。実線＝検証用リポジトリで実装済み、破線＝設計のみ・未定</text>
<text x="40" y="118" font-size="15" font-weight="700" fill="#4a86c5">開発・更新</text>
