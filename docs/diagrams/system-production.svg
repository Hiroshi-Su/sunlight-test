<text x="54" y="819" font-size="13.5" fill="#52606d">現在の天気を 10 分ごとに取得</text>
<text x="54" y="839.5" font-size="13.5" fill="#52606d">雲量・湿度・気温・風・雨</text>
<text x="54" y="860" font-size="13.5" fill="#52606d">ネットがなくても映像は止めない</text>
